[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=0

[Display]

; Which screen corner the minimap is positioned from: 0 = top left, 1 = top right, 2 = bottom left, 3 = bottom right
uAnchor=1

; A nudge per corner, in screen pixels, so switching corners keeps each one's own adjustment
; rather than sharing a single pair. Only the pair matching uAnchor is in use at any time.
; Positive x is always rightwards and positive y always downwards, whichever corner is
; anchored. With a pair at (0, 0) that corner's artwork sits flush with the screen edge.
fOffsetXTopLeft=0
fOffsetYTopLeft=0
fOffsetXTopRight=0
fOffsetYTopRight=0
fOffsetXBottomLeft=0
fOffsetYBottomLeft=0
fOffsetXBottomRight=0
fOffsetYBottomRight=0

; Scale of the minimap, the greater the value the bigger the minimap.
; Capped at whatever keeps the minimap within a quarter of the screen, so a large value here
; will simply be reduced to that limit rather than filling the screen.
fScale=0.5

; Changes the shape of the minimap: 0 = squared, 1 = round
uShape=0

; Displays the minimap on game start: 0 = hidden, 1 = shown (also auto-saved)
bShowOnGameStart=1
; Show the location name (and its "cleared" hint) under the map.
; A compatibility switch for non-English games: the title uses the game's own interface
; font, so a localisation whose glyphs that font does not carry, or whose names are longer
; than the space allows, can show missing characters or text running past the frame. This
; mod cannot change another language's font, so it lets you switch the title off instead.
bShowLocationName=1

; Selected minimap theme - a file name (without .ini) from Data/Interface/DragonsEyeMinimapThemes.
; Empty = untinted. Pick from the settings page dropdown (Display section). Four themes ship
; with the mod; drop your own file in and it appears in the list on the next game start.
sTheme=""


[Controls]

; DirectInput scan code of a key that shows or hides the minimap the moment it is pressed.
; 0 = disabled. Common codes: L=38, M=50, B=48, N=49.
iHideKeyCode=37

; DirectInput scan code of a key that, pressed, alternates the map zoom between fZoomDefault
; and fZoomZoomedIn below. 0 = disabled. Common codes: L=38, M=50, B=48, N=49.
iZoomToggleKeyCode=38

; The two zoom levels that key alternates between, in the game camera's own units (not
; documented, so guessing at a number is not recommended). Easiest to set from the menu with
; "Set to current": zoom the map where you want it, then press that button.
fZoomDefault=0
fZoomZoomedIn=1

; Rotates the minimap towards where the player is facing: 0 = disabled, 1 = enabled
bFollowPlayerCameraRotation=1

; Hold the hide key at least this long to PAN the map instead of toggling it: while held the
; mouse moves the map and the wheel zooms it at the map's own speeds; a shorter press still
; toggles hide/show on release.
fHoldToPanSecs=0.25

; Controller support for the hide key, OFF by default (gamepad buttons are usually all in
; use, and Steam Input can remap). 0 = disabled, 1 = enabled
bGamepadHideButton=0

; XInput button mask for the controller hide/pan button: tap toggles the minimap, holding it
; hands the RIGHT stick to the map for panning. Default 0x0100 = LB (left bumper).
; 0 disables.
iPanHoldGamepadButton=0x0100

[Compass]

; The built-in compass: a compass ring with cardinal letters on a dark backing disc, drawn in
; the minimap's corner while the map is hidden (hide key). 0 = disabled, 1 = enabled
bCompassRing=1

; A quest pointer in the vanilla compass's notched-arrow style, riding the ring - or the
; visible map's inscribed circle - toward the nearest displayed quest objective, with a
; distance readout. 0 = disabled, 1 = enabled
bQuestPointer=1

; Distance readout units: 0 = feet (like the vanilla compass), 1 = metres
bMetricUnits=0

; How far the ring sits inward of the map frame's inscribed circle, in stage pixels
fRingGap=2.4

; Thickness of the ring line, in stage pixels
fRingThickness=0.8

; Length of the quest pointer arrow, in stage pixels
fPointerSize=8

; Size of the N/E/S/W letters and the distance readout
fLabelSize=8

; Colours as hex RGB (0xRRGGBB) or decimal
uRingColor=0xE0E0E0
uNorthColor=0xFF3030
uPointerColor=0xFFE040

; Opacity of the dark backing disc behind the ring, 0-100
uDiscAlpha=90

