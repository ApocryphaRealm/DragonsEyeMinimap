; Dragon's Eye Minimap - TIME WIDGET add-on
; ------------------------------------------
; This file IS the switch. Dragon's Eye Minimap shows the time widget only while this file exists next
; to DragonsEyeMinimap.ini (the FOMOD's "Time Widget" option installs it). Delete the file and the
; widget, its settings page and its DevBench ops are gone; the minimap itself is untouched either way.
; Every setting below can also be changed live on the "Time Widget" page under Dragon's Eye Minimap in
; the Apocrypha Menu Framework; Save there writes it back here.

[TimeWidget]
; 1 = the widget is on (default). 0 = installed but switched off.
bEnabled=1

; WHAT TO SHOW. The in-game clock, the in-game calendar, your real clock, your real calendar - any mix.
bShowGameTime=1
bShowGameDate=0
bShowRealTime=0
bShowRealDate=0
; A day/night symbol beside the in-game clock: a sun by day, a moon by night. Drawn by this mod.
bShowSymbol=1

; FORMATS.
; In-game time: 0 = 24-hour "HH:MM", 1 = 12-hour "h:MM AM", 2 = 12-hour short "h AM".
uTimeFormat=0
; In-game date: 0 = "Morndas, 17th of Last Seed, 4E 201", 1 = "17th of Last Seed", 2 = "4E 201-08-17",
;               3 = "17.08.4E201", 4 = the day name only.
uDateFormat=0
; Real time: 0 = 24-hour "HH:MM", 1 = 12-hour "h:MM AM". bShowSeconds adds ":SS" to the real clock only.
uRealTimeFormat=0
bShowSeconds=0
; Real date: 0 = "YYYY-MM-DD", 1 = "DD.MM.YYYY", 2 = "Monday, 6 September".
uRealDateFormat=0

; DISPLAY. Anchor on the HUD (0 top-left, 1 top-right, 2 bottom-left, 3 bottom-right, 4 top-centre,
; 5 bottom-centre), then offsets from that anchor in HUD pixels (the HUD is 1280x720 wide at any resolution).
uAnchor=4
fOffsetX=0
fOffsetY=8
; Scale 0.25 .. 3.0, opacity 0 .. 100, text size in HUD points before scale, colour as RGB hex.
fScale=1.0
uAlpha=100
fTextSize=18
uTextColor=FFFFFF
; 0 = each shown item on its own line, 1 = everything on one line separated by " | ".
uLayout=0
; 1 = the game's own HUD typeface; 0 = the device font.
bUseHudFont=1

; CONTROL. 0 = always (while no menu is open), 1 = timed (shown for fDisplaySeconds after the hotkey),
; 2 = toggle (the hotkey shows and hides it), 3 = periodic (shown for fDisplaySeconds every
; fPeriodGameMinutes of game time and/or every fPeriodRealMinutes of real time; the hotkey shows it too).
uMode=0
; DirectX scan code of the hotkey. 0 = no key bound (default) - the widget can be left with no binding at all.
iHotkeyKeyCode=0
; Gamepad button mask for the same action. 0 = off (default).
iHotkeyGamepadButton=0
fDisplaySeconds=5
; 0 = that period is off.
fPeriodGameMinutes=60
fPeriodRealMinutes=0
; Hide while any menu is open (the vanilla HUD behaviour). Hide together with the minimap's own hide key.
bHideInMenus=1
bHideWithMinimap=0
